<style>
/* Layout: phone first. One column like a scorebook page; the role switch is pinned on top and, for the coach, the sections sit in a bar at the bottom in thumb reach. From 1100px the column widens, the sections become a row, and player cards become full tables. */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --ink:#12211B; --muted:#586A61; --line:#D3DCD6; --chip:#E5ECE7;
  --accent:#1D3F72; --accent-ink:#FFFFFF; --hot:#C2362B;

  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#16211C; --ink:#E7EFEA; --muted:#9AABA2; --line:#2B3B33; --chip:#22302A;
  --accent:#8FB6F0; --accent-ink:#0B1626; --hot:#F0766B;
  --good:#74D29B; --good-bg:#15382A; --warn:#E8B95A; --warn-bg:#3A2E10; --bad:#F39088; --bad-bg:#40201D;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#16211C; --ink:#E7EFEA; --muted:#9AABA2; --line:#2B3B33; --chip:#22302A;
  --accent:#8FB6F0; --accent-ink:#0B1626; --hot:#F0766B;
  --good:#74D29B; --good-bg:#15382A; --warn:#E8B95A; --warn-bg:#3A2E10; --bad:#F39088; --bad-bg:#40201D;
  color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1100px){ .wrap{max-width:1120px} }
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:6px}
.top .wrap{padding-block:10px 8px}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}

.clock{display:flex;align-items:center;gap:8px;min-width:0}
#clock{font-size:13px;font-weight:600;white-space:nowrap;text-align:center;line-height:1.2}
#clock small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:10px}
.seg button{border:0;background:transparent;min-height:44px;padding:8px 4px;border-radius:7px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px}
.who select{flex:1;min-width:0}

main.wrap{display:flex;flex-direction:column;gap:22px;padding-block:18px 28px}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
h3{font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
/* What just happened, shown where the thumb is, whatever part of the page was tapped. It fades after a few seconds. */
.msg{position:fixed;z-index:7;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin-inline:auto;pointer-events:none;
  background:var(--good-bg);color:var(--good);border:1px solid currentColor;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgb(0 0 0 / .18);animation:toast 6s forwards}
.has-nav .msg{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:1100px){ .has-nav .msg{bottom:16px} }
@keyframes toast{0%,88%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.msg.warn{background:var(--warn-bg);color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;min-width:44px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{font-size:14px}
a.btn{display:inline-flex;align-items:center;text-decoration:none;white-space:normal;box-sizing:border-box}
.btn:disabled{opacity:.45;cursor:not-allowed}
:is(button,select,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number],input[type=text],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;min-height:44px;box-sizing:border-box;font-size:16px}
/* 16px in every field: below that an iPhone zooms the page on focus. */
input[type=file]{font-size:14px;max-width:100%;min-height:44px}
input[type=file]::file-selector-button{font:inherit;font-weight:600;min-height:44px;padding:0 12px;margin-right:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:center;gap:12px}
.jersey{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px}
.hero-name{flex:1;min-width:0}
.hero-name b{display:block;font-size:17px}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}

.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.split div{min-width:0;font-size:13px;color:var(--muted)}
.split b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;min-width:44px;padding:6px 14px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.ontrack{border-color:var(--hot)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > select,.row > input[type=text]{flex:1 1 140px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1 1 150px;min-width:0}
.item > select{flex:1 1 180px}
.item .txt b{display:block;font-weight:600}
.item .txt span{font-size:13px;color:var(--muted)}
.item .acts{display:flex;gap:8px;flex:none;margin-left:auto}
.item.me{background:var(--chip)}
.empty{padding:14px 12px;color:var(--muted);font-size:14px}
.pill{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.waiting{background:var(--warn-bg);color:var(--warn)}
.pill.confirmed,.pill.auto,.pill.approved,.pill.done{background:var(--good-bg);color:var(--good)}
.pill.vetoed,.pill.dismissed{background:var(--bad-bg);color:var(--bad)}
.pill.open{background:var(--chip);color:var(--muted)}
.rank{flex:none;width:22px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--hot);text-align:center}
.pts{flex:none;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}

/* Coach sections. Phone: a bar pinned to the bottom, four sections and More. PC: a row under the role switch. */
.nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{position:relative;padding-inline:0}
.nav-main{display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;border-top:3px solid transparent;background:transparent;min-height:56px;min-width:44px;padding:0 2px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"],.nav button.on{color:var(--ink);border-top-color:var(--hot)}
.nav-more{position:absolute;inset:auto 0 100% 0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 -8px 20px rgb(0 0 0 / .12)}
.nav-more[data-closed]{display:none}
.has-nav footer.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:1100px){
  .nav{position:static;border:0;background:transparent;padding:0;margin-top:14px}
  .nav .wrap{display:flex;flex-wrap:wrap;gap:4px;padding-inline:16px;border-bottom:1px solid var(--line)}
  .nav-main,.nav-more,.nav-more[data-closed]{position:static;display:flex;gap:4px;border:0;box-shadow:none;background:transparent}
  .nav-more{order:2}
  .nav button{min-height:44px;padding:0 14px;font-size:15px;border-top:0;border-bottom:3px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--hot)}
  #tab-more{display:none}
  .has-nav footer.wrap{padding-bottom:28px}
}
.budget{display:flex;align-items:baseline;gap:8px}
.budget b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}

.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.title{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.title h3{font-family:var(--display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.title ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.title li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.title li i{font-style:normal;font-family:var(--display);font-weight:700;color:var(--hot);width:14px}
.title li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title li b{font-variant-numeric:tabular-nums}
.title .you{border-top:1px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted)}

.prog{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.prog-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.prog-row .meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.prog-row .meter i{display:block;height:100%;background:var(--good)}

.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
tr:first-child th{border-top:0;padding:4px 6px}
th:first-child,td:first-child,th.txt,td.txt{text-align:left}
th button{border:0;background:transparent;min-height:44px;padding:4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer;white-space:normal;text-align:inherit;line-height:1.2}
th[aria-sort] button{color:var(--ink)}
.held{color:var(--warn);font-size:13px}
td select{padding:4px 6px}
/* Phone: a table becomes one card per player, or one ranked list per title. */
.sortrow{flex-wrap:nowrap}
.sortrow select{flex:1 1 auto}
.cards{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard-top b{font-size:16px;min-width:0;overflow-wrap:anywhere}
.pcard dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.pcard dl > div{min-width:0}
.pcard dl.tight{grid-template-columns:repeat(3,minmax(0,1fr))}
.pcard dl > div.wide{grid-column:1/-1}
.pcard dt{font-size:13px;color:var(--muted)}
.pcard dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pcard dd select{width:100%}
.pcard-acts{display:flex;gap:8px;justify-content:flex-end}

.rules{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule label{flex:1 1 130px;min-width:0}
.rule label span{display:block;font-size:13px;color:var(--muted)}
.rule input[type=number]{width:92px;text-align:right}
.rule input[type=text]{flex:1 1 120px;min-width:0}
.rule.locked{color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.track{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.track .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.track .nums label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.track .nums input{width:100%}
pre.tpl{margin:0;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace}
.preview{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.preview ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
/* Scouting report: a baseball card. Each bar runs 20 to 80 with a mark at 50, average. */
.scard{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--line)}
.scard-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--hot);border-bottom:1px solid var(--line);padding-bottom:8px}
.scard-head span:last-child{color:var(--muted)}
.grades{display:grid;gap:12px}
@media (min-width:700px){ .grades{grid-template-columns:1fr 1fr;gap:12px 22px} }
.grade-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.grade-top b{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.scale{position:relative;height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:5px 0 4px}
.scale i{display:block;height:100%;background:var(--accent);border-radius:4px}
.scale::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ink);opacity:.4}
.notes{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
footer.wrap{padding-block:0 28px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
footer .next{font-size:15px;color:var(--ink);font-weight:500;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .btn,.seg button,.chips button{transition:background-color .12s,color .12s} }
</style>

<script>
/* ================= rules, dates and scoring (pure) ================= */
const CATS=['Infield','Outfield','Pitching','Catching','Batting','Mental game'];

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DEFAULT_RULES={workoutPts:10,pogPts:25,culturePts:5,windowHours:48,weeklyBudget:10,capPct:30,nudgeDays:14,maxPerDay:1,backDays:14,weekStart:1,weekName:'start',reward:'',gradeFloor:30,gradeCeil:80,scoutStreak:5,scoutPlanPct:75,scoutTeam:3};

// Everything is stored as "days since the season start"; these turn a day number into a date.
const startMs=S=>{const [y,m,d]=S.start.split('-').map(Number);return Date.UTC(y,m-1,d)};

function weekRange(S,d){const back=(dateOf(S,d).getUTCDay()-S.rules.weekStart+7)%7;return {a:d-back,b:d-back+6}}
const weekLabel=(S,r)=>S.rules.weekName==='end'?'Week ending '+short(S,r.b):'Week of '+short(S,r.a);
function monthRange(S,d,off){const t=dateOf(S,d),y=t.getUTCFullYear(),m=t.getUTCMonth()+(off||0);
  return {a:Math.round((Date.UTC(y,m,1)-startMs(S))/DAY),b:Math.round((Date.UTC(y,m+1,0)-startMs(S))/DAY)}}
const monthLabel=(S,r)=>{const t=dateOf(S,r.a);return MONTHS[t.getUTCMonth()]+' '+t.getUTCFullYear()};

}

function reportData(){

  const rows=active(S).map(p=>{const s=score(p.id,S,r),tp=m.mode==='week'?trackProgress(S,p,r):null;
    return {p,s,trackText:tp?(tp.done?'Done':tp.items.reduce((a,i)=>a+i.have,0)+' of '+tp.items.reduce((a,i)=>a+i.need,0)):plural(trackWeeks(S,p,r),'week'),done:tp?tp.done:false}});
  return {m,r,label,rows,T:titles(S,r),nr:notRecognized(S,r)};
}
function reportText(){

    <section><h2>Top effort</h2><div class="list">${top.length?top.map(x=>`<div class="item"><div class="rank">${x.rank}</div><div class="txt"><b>${esc(x.p.name)}</b></div><div class="pts">${x.v}</div></div>`).join(''):'<div class="empty">No workouts counted in this period.</div>'}</div>
      <p class="sub">${S.rules.reward?'Top effort earns: '+esc(S.rules.reward):'No reward set yet. Add one under Rules.'}</p></section>
    <section><h2>Leaders this period</h2>${titlesHtml(D.T,null)}</section>
    <section><h2>By player</h2>${tableHtml('report',cols,D.rows,{sort:'pts',dir:-1})}
      <p class="sub">Period points are shown without the culture cap; the cap applies to the season total.</p></section>
    <section><h2>Not recognized this period</h2><p class="sub">${D.nr.length?esc(D.nr.map(p=>p.name).join(', ')):'Everyone received a culture point.'}</p>
      <div class="tools"><button class="btn primary small" id="rep-copy" data-a="repcopy">Copy report</button></div></section>`;
  }else if(tab==='scout'){
    const cur=scoutPid(),rows=active(S).map(p=>({p,sc:scouting(S,p)})),g=k=>r=>r.sc.tools.find(t=>t.k===k).g;
    const cols=[{k:'name',label:'Player',txt:1,get:r=>r.p.name},{k:'overall',label:'Overall',get:r=>r.sc.overall}].concat(TOOLS.map(t=>({k:t.k,label:t.name,get:g(t.k)})));
    body=`<section><h2>Scouting reports</h2><p class="sub">Effort grades on the 20 to 80 scale, from what's already logged. Each grade is measured against a fixed target, not against teammates, so everyone can grade high. They don't change points or the MVP race.</p>
      ${tableHtml('scout',cols,rows,{sort:'overall',dir:-1})}</section>
    <section><h2>Player card</h2>${cur<0?'<div class="empty">No players on the roster yet.</div>':`<div class="row"><select id="scout-p" data-c="scoutp" aria-label="Player card to show">${opts(active(S).map(p=>[p.id,p.name]),cur)}</select>
      <button class="btn small" id="scout-copy" data-a="scoutcopy">Copy card</button></div>${scoutCardHtml(P(cur))}`}
      <p class="sub">Players and parents see only their own card. Set the lowest grade a card can show under Rules.</p></section>`;
  }else if(tab==='roster'){
    const cols=[{k:'name',label:'Player',txt:1,get:r=>r.p.name},{k:'num',label:'#',get:r=>r.p.num},{k:'pos',label:'Pos',txt:1,get:r=>r.p.pos},
      {k:'track',label:'Track',txt:1,get:r=>trackOf(S,r.p).name,html:r=>`<select id="tr-${r.p.id}" data-c="ptrack" data-id="${r.p.id}" aria-label="Track for ${esc(r.p.name)}">${trackOpts(trackOf(S,r.p).id)}</select>`},
      {k:'adult',label:'Parent',txt:1,get:r=>r.p.adult},{k:'second',label:'Second adult',txt:1,get:r=>r.p.second||''},{k:'pts',label:'Points',get:r=>r.s.total},
      {k:'edit',label:'',nosort:1,noexport:1,get:()=>'',html:r=>`<button class="btn small" id="edit-${r.p.id}" data-a="edit" data-id="${r.p.id}" aria-label="Edit ${esc(r.p.name)}">Edit</button>`}];
    const gone=S.players.filter(p=>!p.active),e=EDIT,ep=e&&e.draft?e.draft:e&&e.id!=null?P(e.id):{name:'',num:'',pos:'',adult:'',second:'',track:S.tracks[0].id};
    body=`<section><h2>Roster</h2><p class="sub">${plural(active(S).length,'player')}. Sort by any value; use Columns to show less.</p>
      ${e?`<div class="form" id="player-form"><label>Name<input type="text" id="f-name" maxlength="40" value="${esc(ep.name)}"></label><label>Number<input type="number" inputmode="numeric" id="f-num" min="0" max="99" value="${esc(ep.num)}"></label>
        <label>Position<input type="text" id="f-pos" maxlength="6" value="${esc(ep.pos)}"></label><label>Track<select id="f-track">${trackOpts(ep.track)}</select></label>
        <label>Parent<input type="text" id="f-adult" maxlength="40" value="${esc(ep.adult)}"></label><label>Second adult<input type="text" id="f-second" maxlength="40" value="${esc(ep.second||'')}"></label>
        <div class="row wide"><button class="btn primary small" id="f-save" data-a="psave">${e.id!=null?'Save':'Add player'}</button><button class="btn small" id="f-cancel" data-a="pcancel">Cancel</button>${e.id!=null?`<button class="btn small danger" id="f-remove" data-a="premove">Remove from roster</button>`:''}</div></div>`
        :`<div class="tools"><button class="btn small primary" id="add-player" data-a="padd">Add a player</button></div>`}
      ${tableHtml('roster',cols,standings(S),{sort:'num',dir:1})}
      <div class="row"><select id="all-track" aria-label="Track for everyone">${trackOpts()}</select><button class="btn small" id="all-track-go" data-a="alltrack">Set for everyone</button></div>
      ${gone.length?`<div class="list">${gone.map(p=>`<div class="item"><div class="txt"><b>${esc(p.name)}</b><span>Removed. History is kept.</span></div><div class="acts"><button class="btn small" id="restore-${p.id}" data-a="restore" data-id="${p.id}" aria-label="Restore ${esc(p.name)}">Restore</button></div></div>`).join('')}</div>`:''}</section>
    <section><h2>Import or export the roster</h2><p class="sub">Rows match players by jersey number: a match updates that player, a new number adds one. Players missing from the file are left alone.</p>
      ${importHtml('roster')}${templateHtml('roster',rosterRows(S).slice(0,3))}
      <div class="tools"><button class="btn small" id="roster-copy" data-a="rostercopy">Copy roster</button>${DL?'<button class="btn small" id="roster-dl" data-a="rosterdl">Download roster CSV</button>':''}</div></section>
    <section><h2>Tracks</h2><p class="sub">A track is a weekly plan: how many of each workout type to do. Off-track workouts still earn the same points.</p>
      ${S.tracks.map(t=>`<div class="track"><div class="row"><input type="text" id="tn-${t.id}" data-c="tname" data-id="${t.id}" maxlength="24" value="${esc(t.name)}" aria-label="Name of the ${esc(t.name)} track" style="flex:1 1 140px">
        <span class="sub">${plural(active(S).filter(p=>trackOf(S,p).id===t.id).length,'player')}</span>${S.tracks.length>1?`<button class="btn small danger" id="tdel-${t.id}" data-a="tdel" data-id="${t.id}" aria-label="Remove the ${esc(t.name)} track">Remove</button>`:''}</div>
        <div class="nums"><label>Any type<input type="number" inputmode="numeric" min="0" max="14" id="ta-${t.id}" data-c="tany" data-id="${t.id}" value="${t.any||0}" aria-label="${esc(t.name)}: any type, per week"></label>
        ${CATS.map((c,i)=>`<label>${c}<input type="number" inputmode="numeric" min="0" max="14" id="tc-${t.id}-${i}" data-c="tper" data-id="${t.id}" data-k="${c}" value="${t.per[c]||0}" aria-label="${esc(t.name)}: ${c}, per week"></label>`).join('')}</div></div>`).join('')}
      <div><button class="btn small" id="add-track" data-a="tadd">Add a track</button></div></section>`;
  }else{
    const R=[['workoutPts','Workout','points each'],['pogPts','Player of the game','points each'],['culturePts','Culture point','points each'],
      ['windowHours','Auto-approve window','hours before an unconfirmed workout counts'],['weeklyBudget','Culture budget','awards the coach can give per week'],
      ['capPct','Culture cap','most of a player\'s total that can be culture, in %'],['nudgeDays','Recognition reminder','days without a culture point'],
      ['maxPerDay','Workouts per day','most that count per player per day'],['backDays','Import can go back','days before today a spreadsheet row may be dated']];
    const SR=[['gradeFloor','Lowest grade','floor for any grade on a card, 20 to 80'],['gradeCeil','Highest grade','ceiling for any grade on a card, 20 to 80'],
      ['scoutStreak','Consistency target','streak in days that grades 60'],['scoutPlanPct','Plan target','% of weeks with the track finished that grades 60'],
      ['scoutTeam','Teammate target','culture awards or nominations every 4 weeks that grade 60']];
    const ruleRow=([k,t,d])=>`<div class="rule"><label for="rule-${k}">${t}<span>${d}</span></label><input type="number" inputmode="numeric" min="0" id="rule-${k}" data-c="rule" data-k="${k}" value="${S.rules[k]}"></div>`;
    body=`<section><h2>Season and weeks</h2>
      <div class="rules"><div class="rule"><label for="season-start">Season starts<span>Today in this demo is ${esc(dl(S.now))}</span></label><input type="date" id="season-start" data-c="start" value="${esc(S.start)}"></div>
      <div class="rule"><label for="week-start">Week starts on<span>The culture budget resets on this day</span></label><select id="week-start" data-c="weekstart">${opts([[1,'Monday'],[0,'Sunday']],S.rules.weekStart)}</select></div>
      <div class="rule"><label for="week-name">Weeks are named by<span>${esc(weekLabel(S,weekRange(S,S.now)))}</span></label><select id="week-name" data-c="weekname">${opts([['start','First day'],['end','Last day']],S.rules.weekName)}</select></div></div>
      <p class="sub">The demo stores days since the season start, so changing the date moves the example history with it. In the real app each workout keeps its own date.</p></section>
    <section><h2>Points and limits</h2><p class="sub">Change any number and the standings recalculate.</p>
      <div class="rules">${R.map(ruleRow).join('')}
      <div class="rule"><label for="rule-reward">Top effort reward<span>Shown to players and on the report</span></label><input type="text" id="rule-reward" data-c="reward" maxlength="60" value="${esc(S.rules.reward)}" placeholder="Not set"></div>
      <div class="rule locked"><label>Video proof from players<span>Off. Only available for 15u and up.</span></label><span class="pill open">Locked</span></div></div>
      <div><button class="btn small" id="rules-default" data-a="rulesdefault">Back to starting values</button></div></section>
    <section><h2>Scouting report</h2><p class="sub">Each grade is 60 when a player hits its target, 50 at three quarters of it, and 80 at one and a half times it. Work rate uses each player's track, set under Roster. Change a number and every card recalculates.</p>
      <div class="rules">${SR.map(ruleRow).join('')}</div></section>
    <section><h2>Culture types</h2><p class="sub">Each type gets its own title on the Leaders board. Renaming keeps past awards; removing moves them to Other.</p>
      <div class="rules">${S.types.map((t,i)=>`<div class="rule"><input type="text" id="type-${i}" data-c="typename" data-i="${i}" maxlength="24" value="${esc(t)}" aria-label="Culture type ${i+1}"><button class="btn small danger" id="type-del-${i}" data-a="typedel" data-i="${i}" aria-label="Remove the ${esc(t)} type">Remove</button></div>`).join('')}
      <div class="rule"><input type="text" id="type-new" maxlength="24" placeholder="New type, such as Leadership" aria-label="New culture type"><button class="btn small" id="type-add" data-a="typeadd">Add</button></div></div></section>`;
  }
  return body;
}

/* ---------- render ---------- */
const TABS=[['inbox','Inbox'],['award','Award'],['leaders','Leaders'],['report','Report'],['scout','Scouting'],['standings','Standings'],['roster','Roster'],['rules','Rules']],NAV_MAIN=4;
function navHtml(){ // the first four sit in the bottom bar on a phone; the rest open from More
  const b=([k,t])=>`<button id="tab-${k}" data-a="tab" data-v="${k}" aria-current="${S.ui.tab===k?'page':'false'}">${t}</button>`;
  const inMore=TABS.slice(NAV_MAIN).some(([k])=>k===S.ui.tab);
  return `<div class="nav-more" id="nav-more"${NAVOPEN?'':' data-closed'}>${TABS.slice(NAV_MAIN).map(b).join('')}</div>
    <div class="nav-main">${TABS.slice(0,NAV_MAIN).map(b).join('')}<button id="tab-more" data-a="more" class="${inMore?'on':''}" aria-expanded="${NAVOPEN}" aria-controls="nav-more">More</button></div>`}
function render(){
  const A=active(S);
  if(A.length){if(!P(S.ui.player).active)S.ui.player=A[0].id;if(!P(S.ui.fam).active)S.ui.fam=A[0].id}
  $('clock').innerHTML=`${esc(dl(S.now))}<small>${esc(weekLabel(S,weekRange(S,S.now)))}</small>`;
  $('prev-day').disabled=S.now<=0;
  for(const r of ['coach','parent','player'])$('role-'+r).setAttribute('aria-pressed',S.ui.role===r);
  $('who-row').hidden=S.ui.role==='coach';
  if(S.ui.role==='parent')$('who').innerHTML=opts(A.map(p=>[p.id,(p.adult||'Parent')+' ('+first(p.id)+'\'s parent)']),S.ui.fam);
  if(S.ui.role==='player')$('who').innerHTML=opts(A.map(p=>[p.id,p.name+' #'+p.num]),S.ui.player);
  const coach=S.ui.role==='coach';
  $('nav').hidden=!coach;$('nav-in').innerHTML=coach?navHtml():'';document.body.classList.toggle('has-nav',coach);
  const m=S.ui.msg?`<div class="msg${S.ui.msgWarn?' warn':''}" role="status" data-overlay>${esc(S.ui.msg)}</div>`:'';
  const box=COPYBOX?`<section><p class="sub">Copying isn't available here. Select the text below and copy it.</p><pre class="tpl" id="copybox">${esc(COPYBOX)}</pre></section>`:'';
  $('app').innerHTML=m+box+(S.ui.role==='coach'?coachView():S.ui.role==='parent'?parentView():playerView());
  $('reset').textContent=resetArmed?'Tap again to reset':'Reset demo';
}
function say(t,warn){S.ui.msg=t;S.ui.msgWarn=!!warn}
function giveCulture(p,type,note,via){S.culture.push({id:S.nextId++,p,at:S.now,type,note:note||'',via})}
function copyOut(text,what){const done=()=>{say(what+' copied.');render()};const fail=()=>{COPYBOX=text;say('');render()};
  try{navigator.clipboard.writeText(text).then(done,fail)}catch(e){fail()}}
async function saveFile(filename,data){if(!DL)return;
  try{await DL.save({filename,data});say('Saved '+filename+'.')}
  catch(e){const c=e&&e.code;if(c==='declined')say('Download cancelled.',true);else if(c==='rate_limited')say('One moment, then try again.',true);else{if(c!=='host_unavailable')DL=null;say('Downloading isn\'t available here. Use Copy instead.',true)}}
  render()}
const whoImports=()=>S.ui.role==='parent'?{role:'parent',pid:S.ui.fam}:{role:'coach'};
function stageImport(kind,rows,file){PENDING={kind,file:file||'file',res:kind==='roster'?parseRoster(rows,S):parseWorkouts(rows,S,whoImports())};render()}
function readFile(file,kind){
  const bad=msg=>{PENDING={kind,file:file.name,res:{ok:[],skipped:[],error:msg}};render()},fr=new FileReader();
  fr.onerror=()=>bad('That file could not be read.');
  if(/\.xlsx?$/i.test(file.name)){
    if(!window.XLSX)return bad('Excel files can\'t be read here. Save the sheet as CSV and try again.');
    fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});stageImport(kind,XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}),file.name)}catch(e){bad('That Excel file could not be read.')}};
    fr.readAsArrayBuffer(file);
  }else{fr.onload=()=>stageImport(kind,parseCsv(String(fr.result)),file.name);fr.readAsText(file)}
}
function commitImport(){
  const X=PENDING;if(!X||!X.res.ok.length)return;
  if(X.kind==='roster'){let add=0,upd=0;
    for(const r of X.res.ok){const p=r.match!=null?byId(S,r.match):null;
      if(p){p.name=r.name;if(r.pos)p.pos=r.pos;if(r.adult)p.adult=r.adult;p.second=r.second||p.second;if(r.track)p.track=r.track;p.active=true;upd++}
      else{S.players.push({id:S.nextId++,name:r.name,num:r.num,pos:r.pos,adult:r.adult,second:r.second,track:r.track||S.tracks[0].id,active:true});add++}}
    say(`Roster imported: ${add} added, ${upd} updated.`);
  }else{const by=S.ui.role==='parent'?'parent':'coach';
    for(const r of X.res.ok)S.workouts.push({id:S.nextId++,p:r.p,cat:r.cat,at:r.at,decision:'confirmed',by,src:'import'});
    say(`${plural(X.res.ok.length,'workout')} imported and confirmed.`)}
  PENDING=null;
}

/* ---------- actions ---------- */
function act(a,d){
  const id=Number(d.id);
  if(a!=='reset')resetArmed=false;
  if(a==='tcopy'){copyOut(toCsv(tableRows(d.t)).replace(/,/g,'\t'),'Table');return}
  if(a==='tcsv'){saveFile(d.t+'.csv',toCsv(tableRows(d.t)));return}
  if(a==='repcopy'){copyOut(reportText(),'Report');return}
  if(a==='scoutcopy'){const pid=scoutPid();if(pid>=0)copyOut(scoutText(P(pid)),'Card');return}
  if(a==='rostercopy'){copyOut(toCsv(rosterRows(S)),'Roster');return}
  if(a==='rosterdl'){saveFile('roster.csv',toCsv(rosterRows(S)));return}
  if(a==='tplcopy'){copyOut(toCsv(TPL[d.k]()),'Template');return}
  if(a==='tpldl'){saveFile(d.k==='roster'?'roster-template.csv':'workout-template.csv',toCsv(TPL[d.k]()));return}
  say('');COPYBOX='';
  if(a!=='more')NAVOPEN=false;
  if(a==='role'){S.ui.role=d.v;PENDING=null;EDIT=null}
  else if(a==='tab'){S.ui.tab=d.v;PENDING=null;EDIT=null;OPENCOLS=''}
  else if(a==='more')NAVOPEN=!NAVOPEN;
  else if(a==='cat')S.ui.cat=d.v;
  else if(a==='nextday'){S.now++;say('It is now '+dl(S.now)+'.')}
  else if(a==='prevday'){if(S.now>0){S.now--;say('Back to '+dl(S.now)+'. Anything logged after today still shows.',true)}}
  else if(a==='log'){S.workouts.push({id:S.nextId++,p:S.ui.player,cat:S.ui.cat,at:S.now,decision:null,by:null});say('Workout logged. It counts once an adult confirms, or after '+S.rules.windowHours+' hours.')}
  else if(a==='confirm'||a==='coachconfirm'){const w=S.workouts.find(w=>w.id===id);if(w){w.decision='confirmed';w.by=a==='confirm'?'parent':'coach';say('Confirmed. '+first(w.p)+'\'s points are in.')}}
  else if(a==='veto'){const w=S.workouts.find(w=>w.id===id);if(w){w.decision='vetoed';w.by='parent';say('Vetoed. That workout will not count.',true)}}
  else if(a==='nominate'){const to=Number($('nom-to').value),t=$('nom-type').value;
    if(t){S.noms.push({id:S.nextId++,from:S.ui.player,to,type:t,at:S.now,state:'open'});say('Nomination sent to Coach.')}}
  else if(a==='nomok'){const n=S.noms.find(n=>n.id===id);if(n&&budgetLeft(S)){n.state='approved';giveCulture(n.to,S.types.includes(n.type)?n.type:'Other',S.types.includes(n.type)?'':n.type,'nomination');say(first(n.to)+' gets '+S.rules.culturePts+' culture points.')}}
  else if(a==='nomno'){const n=S.noms.find(n=>n.id===id);if(n){n.state='dismissed';say('Nomination dismissed.')}}
  else if(a==='pick'){S.ui.awardTo=id;say(P(id).name+' is selected above.')}
  else if(a==='award'){if(budgetLeft(S)){const p=Number($('award-player').value),custom=$('award-custom').value.trim(),t=custom?'Other':$('award-type').value;
    if(t){giveCulture(p,t,custom,'coach');S.ui.awardTo=p;say(first(p)+' gets '+S.rules.culturePts+' culture points for '+(custom||t).toLowerCase()+'.')}}}
  else if(a==='addgame'){S.games.push({id:S.nextId++,day:S.now,opp:'Game '+(S.games.length+1),pog:null});say('Game added. Pick the player of the game.')}
  else if(a==='rulesdefault'){S.rules={...DEFAULT_RULES};say('Rules are back to the starting values.')}
  else if(a==='sort'){const st=S.ui.tables[d.t];if(st){if(st.sort===d.k)st.dir=-st.dir;else{st.sort=d.k;st.dir=firstDir(d.k)}}}
  else if(a==='pickt'){const st=S.ui.tables[d.t];if(st){st.sort=d.k;st.dir=-1}}
  else if(a==='sortdir'){const st=S.ui.tables[d.t];if(st)st.dir=-st.dir}
  else if(a==='cols')OPENCOLS=OPENCOLS===d.t?'':d.t;
  else if(a==='colt'){const st=S.ui.tables[d.t];if(st){const i=st.hide.indexOf(d.k);if(i>=0)st.hide.splice(i,1);else st.hide.push(d.k)}}
  else if(a==='repmode'){S.ui.report={mode:d.v,off:0}}
  else if(a==='repoff'){S.ui.report.off=Math.min(0,S.ui.report.off+Number(d.v))}
  else if(a==='importgo')commitImport();
  else if(a==='importcancel')PENDING=null;
  else if(a==='padd')EDIT={id:null};
  else if(a==='edit')EDIT={id};
  else if(a==='pcancel')EDIT=null;
  else if(a==='psave'){const name=$('f-name').value.trim(),num=parseInt($('f-num').value,10),cur=EDIT.id;
    // keep what was typed if the save is refused
    EDIT.draft={name,num:$('f-num').value,pos:$('f-pos').value.trim(),adult:$('f-adult').value.trim(),second:$('f-second').value.trim(),track:Number($('f-track').value)};
    if(!name)say('A player needs a name.',true);
    else if(isNaN(num))say('A player needs a jersey number.',true);
    else if(active(S).some(p=>p.num===num&&p.id!==cur))say('Number '+num+' is already taken.',true);
    else{const v={name,num,pos:$('f-pos').value.trim(),adult:$('f-adult').value.trim(),second:$('f-second').value.trim(),track:Number($('f-track').value)};
      if(cur!=null)Object.assign(byId(S,cur),v);else S.players.push({id:S.nextId++,active:true,...v});
      say(name+(cur!=null?' updated.':' added to the roster.'));EDIT=null}}
  else if(a==='premove'){const p=byId(S,EDIT.id);if(p){p.active=false;say(p.name+' removed. Their history is kept and you can restore them below.',true)}EDIT=null}
  else if(a==='restore'){const p=byId(S,id);if(p){if(active(S).some(x=>x.num===p.num))say('Number '+p.num+' is in use. Change it first.',true);else{p.active=true;say(p.name+' is back on the roster.')}}}
  else if(a==='alltrack'){const t=Number($('all-track').value);for(const p of active(S))p.track=t;say('Everyone is on the '+trackOf(S,active(S)[0]||{track:t}).name+' track.')}
  else if(a==='tadd'){S.tracks.push({id:S.nextId++,name:'New track',any:3,per:{}});say('Track added. Name it and set its weekly numbers.')}
  else if(a==='tdel'){if(S.tracks.length>1){const t=S.tracks.find(t=>t.id===id);S.tracks=S.tracks.filter(t=>t.id!==id);for(const p of S.players)if(p.track===id)p.track=S.tracks[0].id;say((t?t.name:'Track')+' removed. Its players moved to '+S.tracks[0].name+'.',true)}}
  else if(a==='typeadd'){const v=$('type-new').value.trim();if(!v)say('Type a name first.',true);else if(v.toLowerCase()==='other'||S.types.some(t=>t.toLowerCase()===v.toLowerCase()))say('That type already exists.',true);else{S.types.push(v);say(v+' added. It now has its own title.')}}
  else if(a==='typedel'){const t=S.types[Number(d.i)];if(t){S.types.splice(Number(d.i),1);for(const c of S.culture)if(c.type===t){c.type='Other';c.note=c.note||t}say(t+' removed. Past awards moved to Other.',true)}}
  else if(a==='reset'){if(resetArmed){resetArmed=false;EDIT=null;PENDING=null;S=seed();say('Demo reset to the example season.')}else resetArmed=true}
  save();render();
  if(a==='tab')window.scrollTo(0,0);
  if(a==='pick')$('award-player').scrollIntoView({block:'center'});
  if(a==='edit'||a==='padd')$('player-form').scrollIntoView({block:'center'});
}
function change(c,t){
  resetArmed=false;say('');const id=Number(t.dataset.id);
  NAVOPEN=false;
  if(c==='who'){PENDING=null;if(S.ui.role==='parent')S.ui.fam=Number(t.value);else S.ui.player=Number(t.value)}
  else if(c==='scoutp')S.ui.scout=Number(t.value);
  else if(c==='sortby'){const st=S.ui.tables[t.dataset.t];if(st){st.sort=t.value;st.dir=firstDir(t.value)}}
  else if(c==='pog'){const g=S.games.find(g=>g.id===id);if(g){g.pog=t.value===''?null:Number(t.value);say(g.pog===null?'Player of the game cleared.':first(g.pog)+' is player of the game.')}}
  else if(c==='rule'){let v=Math.max(0,Math.floor(Number(t.value)||0));if(t.dataset.k==='capPct')v=Math.min(100,v);const k=t.dataset.k;
    if(k==='gradeFloor'||k==='gradeCeil')v=Math.min(80,Math.max(20,v));
    if(k==='scoutStreak'||k==='scoutTeam')v=Math.max(1,v);
    if(k==='scoutPlanPct')v=Math.min(100,Math.max(1,v));
    S.rules[k]=v;
    // floor and ceiling never cross: moving one pushes the other
    if(k==='gradeFloor'&&S.rules.gradeCeil<v)S.rules.gradeCeil=v;
    if(k==='gradeCeil'&&S.rules.gradeFloor>v)S.rules.gradeFloor=v;
    if(k.startsWith('grade')||k.startsWith('scout'))say('Scouting grades updated.')}
  else if(c==='reward')S.rules.reward=t.value.trim();
  else if(c==='start'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.start=t.value;say('Season now starts '+dl(0)+'. Today in the demo is '+dl(S.now)+'.')}}
  else if(c==='weekstart')S.rules.weekStart=Number(t.value);
  else if(c==='weekname')S.rules.weekName=t.value;
  else if(c==='ptrack'){const p=byId(S,id);if(p){p.track=Number(t.value);say(p.name+' is on the '+trackOf(S,p).name+' track.')}}
  else if(c==='tname'){const tr=S.tracks.find(x=>x.id===id);if(tr&&t.value.trim())tr.name=t.value.trim()}
  else if(c==='tany'){const tr=S.tracks.find(x=>x.id===id);if(tr)tr.any=Math.max(0,Math.floor(Number(t.value)||0))}
  else if(c==='tper'){const tr=S.tracks.find(x=>x.id===id);if(tr){const v=Math.max(0,Math.floor(Number(t.value)||0));if(v)tr.per[t.dataset.k]=v;else delete tr.per[t.dataset.k]}}
  else if(c==='typename'){const i=Number(t.dataset.i),old=S.types[i],v=t.value.trim();
    if(v&&v!==old&&v.toLowerCase()!=='other'&&!S.types.some((x,j)=>j!==i&&x.toLowerCase()===v.toLowerCase())){S.types[i]=v;for(const x of S.culture)if(x.type===old)x.type=v;for(const n of S.noms)if(n.type===old)n.type=v;say(old+' is now '+v+'.')}}
  save();render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.file){if(t.files&&t.files[0])readFile(t.files[0],t.dataset.file)}
  else if(t.dataset&&t.dataset.c)change(t.dataset.c,t)});
window.__demo={stageImport,get state(){return S}};
WIDE.addEventListener('change',render);
render();
if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{if(d){DL=d;render()}},()=>{});
}
</script>
